[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alma-point-source-extractor"
version = "0.3.0"
description = "ALMA Point Source Extractor (APSE)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "License not yet specified; see repository owner"}
authors = [{name = "APSE contributors"}]
dependencies = [
    "numpy>=1.23,<3", "scipy>=1.9", "pandas>=1.5",
    "shapely>=2", "astropy>=5", "requests>=2.28",
    "beautifulsoup4>=4.11", "astroquery>=0.4.6", "pyvo>=1.4"
]

[project.scripts]
apse = "apse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
